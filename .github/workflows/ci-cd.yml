name: MLOps CI/CD Pipeline

# ทำงานทุกครั้งที่มีการ Push โค้ดเข้า branch main
on:
  push:
    branches: [ "main" , "kj" ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    # 1. ดึงโค้ดล่าสุดจาก GitHub
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # เพิ่มการบังคับให้ดึงประวัติ Git ทั้งหมด (แก้ Shallow update)
        lfs: true       # เพิ่มการเปิดระบบ LFS ให้รองรับไฟล์โมเดล ONNX (แก้ lfs-check error)
    # 2. ติดตั้ง Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    # 3. ติดตั้ง Dependencies และ pytest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx==0.27.2

    # 4. รัน Unit Test (CI)
    # ถ้าขั้นตอนนี้พัง (เทสไม่ผ่าน) ระบบจะหยุดทำงานทันที ไม่ข้ามไปขั้นตอน Deploy
    - name: Run Unit Tests with pytest
      run: |
        pytest test_main.py -v

    # 5. สั่ง Deploy ขึ้น Hugging Face Spaces (CD) 
    # จะทำงานต่อเมื่อ Test ผ่าน 100% เท่านั้น
    - name: Push to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN_KJ }}
      run: |
        # 1. ลบประวัติ Git เดิมทิ้ง เพื่อทิ้งไฟล์ใหญ่ที่ติดอยู่ในอดีต
        rm -rf .git
        
        # 2. สร้าง Git ใหม่ที่สะอาดหมดจด
        git init
        git config user.name "CI/CD Bot"
        git config user.email "bot@example.com"
        
        # 3. สร้างกฎ LFS ใหม่
        git lfs install
        git lfs track "*.onnx"
        
        # 4. แพ็กของและ Commit ใหม่ (จะมีแค่ข้อมูลล่าสุด)
        git branch -M main
        git add .
        git add -f models/onnx/model_quantized.onnx
        git add -f models/original/preprocessor_config.json
        
        git commit -m "Auto Deploy from GitHub Actions with ONNX Model"
        
        # 5. ส่งขึ้น Hugging Face (ใช้ตัวแปร $HF_TOKEN)
        git remote add space https://KridtinJeeranggoon:$HF_TOKEN@huggingface.co/spaces/KridtinJeeranggoon/MLOps-Project
        
        # 6. Force Push ทับของเก่าบน HF ไปเลย
        git push --force space main